<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f1f2f4" />
    <meta
      name="description"
      content="RedLens AI Camera · 手机与电脑双模式摄影体验"
    />
    <title>RedLens AI Camera</title>
    <link rel="icon" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/src/preview.css" />
  </head>
  <body>
    <header class="preview-toolbar">
      <a class="preview-brand" href="/">RedLens <span>AI CAMERA</span></a>
      <div class="view-switch" role="group" aria-label="预览设备">
        <button type="button" data-view="phone" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="2" width="12" height="20" rx="3" />
            <path d="M10 18h4" /></svg
          >手机</button
        ><button type="button" data-view="desktop" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" />
            <path d="M8 21h8m-4-4v4" /></svg
          >电脑
        </button>
      </div>
      <span class="preview-caption">选择适合你的创作视角</span>
    </header>
    <main class="preview-stage">
      <div class="device-frame">
        <iframe
          id="product"
          src="/camera.html"
          title="RedLens AI Camera 摄影工作室"
          allow="camera; web-share"
          allowfullscreen
        ></iframe>
      </div>
    </main>
    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
